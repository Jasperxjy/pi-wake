name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19.0", "24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee npm-test.log; then
            FAILS=$(grep -E "^✖ " npm-test.log | head -20 || true)
            echo "::error::npm test failed:\n$FAILS"
            exit 1
          fi
      - name: package smoke (real tarball install + bin)
        shell: bash
        run: |
          set -uo pipefail
          echo "node: $(node -v), npm: $(npm -v), os: $(uname -s)"
          echo "::group::npm pack"
          PACK_OUT=$(npm pack --silent 2>&1)
          echo "$PACK_OUT"
          TGZ=$(echo "$PACK_OUT" | tail -1)
          echo "tarball: [$TGZ]"
          echo "::endgroup::"
          if [ -z "$TGZ" ] || [ ! -f "$TGZ" ]; then
            echo "::error::npm pack produced no tarball: [$PACK_OUT]"
            exit 1
          fi
          TMP=$(mktemp -d)
          echo "install dir: $TMP"
          cd "$TMP"
          npm init -y >/dev/null
          # Install the actual publish tarball, not the source checkout: this catches
          # missing files in the `files` whitelist, broken relative imports, and the
          # pi-wake-daemon bin wiring.
          echo "::group::npm install tarball"
          if ! npm install "$OLDPWD/$TGZ" --no-audit --no-fund --legacy-peer-deps; then
            echo "::error::npm install of the tarball failed"
            exit 1
          fi
          echo "::endgroup::"
          echo "::group::layout checks"
          for f in dist/daemon.js dist/runtime.js dist/core.js extensions/pi-wake/index.ts; do
            if [ -f "node_modules/pi-wake/$f" ]; then echo "$f present"; else echo "::error::$f MISSING from installed package"; exit 1; fi
          done
          node -e "const p=require('pi-wake/package.json'); if(!p.bin||p.bin['pi-wake-daemon']!=='dist/daemon.js') process.exit(1)" && echo "bin wiring ok"
          echo "::endgroup::"
          echo "::group::installed daemon smoke"
          WAKE_ALARM_CWD="$TMP" WAKE_ALARM_SPAWN_DRY_RUN=1 node node_modules/pi-wake/dist/daemon.js >daemon.log 2>&1 &
          DPID=$!
          # Poll for startup instead of a fixed sleep, so runner load cannot flake it.
          OK=0
          for i in $(seq 1 20); do
            if grep -q "watching project" daemon.log 2>/dev/null; then OK=1; break; fi
            sleep 0.5
          done
          kill "$DPID" 2>/dev/null || true
          wait "$DPID" 2>/dev/null || true
          if [ "$OK" != "1" ]; then
            LOG=$(cat daemon.log 2>/dev/null || echo "<no daemon.log>")
            echo "daemon.log:"
            echo "$LOG"
            echo "::error::installed daemon did not start; log: [$LOG]"
            exit 1
          fi
          echo "daemon started"
          echo "::endgroup::"
      - name: extension load smoke (real Pi, RPC mode)
        shell: bash
        run: |
          printf '{"type":"get_state"}\n' | npx --no-install pi --mode rpc --offline --approve --no-session --extension extensions/pi-wake/index.ts | grep -q '"success":true'
