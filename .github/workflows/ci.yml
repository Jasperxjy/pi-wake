name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19.0", "24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee npm-test.log; then
            # Node 24 prints "✖ name", Node 22 prints TAP "not ok N - name"; capture
            # the assertion context for both so the annotation shows the real error.
            CTX=$(grep -E -A 12 "^✖ |^not ok " npm-test.log | head -80 | tr '\n' ' ')
            echo "::error::npm test failed: $CTX"
            exit 1
          fi
      - name: package smoke (real tarball install + bin)
        shell: bash
        run: |
          set -uo pipefail
          echo "node: $(node -v), npm: $(npm -v), os: $(uname -s)"
          echo "::group::npm pack"
          PACK_OUT=$(npm pack --silent 2>&1)
          echo "$PACK_OUT"
          TGZ=$(echo "$PACK_OUT" | tail -1)
          echo "tarball: [$TGZ]"
          echo "::endgroup::"
          if [ -z "$TGZ" ] || [ ! -f "$TGZ" ]; then
            echo "::error::npm pack produced no tarball: [$PACK_OUT]"
            exit 1
          fi
          TMP=$(mktemp -d)
          echo "install dir: $TMP"
          cd "$TMP"
          npm init -y >/dev/null
          # Install the actual publish tarball, not the source checkout: this catches
          # missing files in the `files` whitelist, broken relative imports, and the
          # pi-wake-daemon bin wiring.
          echo "::group::npm install tarball"
          if ! npm install "$OLDPWD/$TGZ" --no-audit --no-fund --legacy-peer-deps; then
            echo "::error::npm install of the tarball failed"
            exit 1
          fi
          echo "::endgroup::"
          echo "::group::layout checks"
          for f in dist/daemon.js dist/runtime.js dist/core.js extensions/pi-wake/index.ts; do
            if [ -f "node_modules/pi-wake/$f" ]; then echo "$f present"; else echo "::error::$f MISSING from installed package"; exit 1; fi
          done
          if ! node -e "const p=require('pi-wake/package.json'); if(!p.bin||p.bin['pi-wake-daemon']!=='dist/daemon.js') process.exit(1)"; then
            echo "::error::invalid pi-wake-daemon bin wiring in the installed package"
            exit 1
          fi
          echo "bin wiring ok"
          echo "::endgroup::"
          echo "::group::installed daemon smoke (via the npm bin shim)"
          # Execute the REAL npm bin shim (node_modules/.bin/pi-wake-daemon), not the
          # compiled file directly, so shim generation and the bin target are tested.
          WAKE_ALARM_CWD="$TMP" WAKE_ALARM_SPAWN_DRY_RUN=1 node_modules/.bin/pi-wake-daemon >daemon.log 2>&1 &
          DPID=$!
          # Poll for startup instead of a fixed sleep, so runner load cannot flake it.
          OK=0
          for i in $(seq 1 20); do
            if grep -q "watching project" daemon.log 2>/dev/null; then OK=1; break; fi
            sleep 0.5
          done
          kill "$DPID" 2>/dev/null || true
          wait "$DPID" 2>/dev/null || true
          if [ "$OK" != "1" ]; then
            LOG=$(cat daemon.log 2>/dev/null || echo "<no daemon.log>")
            echo "daemon.log:"
            echo "$LOG"
            echo "::error::installed daemon (via bin shim) did not start; log: [$LOG]"
            exit 1
          fi
          echo "daemon started via node_modules/.bin/pi-wake-daemon"
          echo "::endgroup::"
          echo "::group::group/condition state fixture restore"
          # Release gate: the installed daemon must restore a v3 state containing
          # group and condition alarms (the regression that shipped 0.1.0 with
          # 'kind must be timer or container' in restoreBase).
          mkdir -p "$TMP/.pi"
          printf '%s\n' '{"remote":{"host":"example.com","user":"u","identityFile":"id_rsa","allowedRemoteLogRoots":["/data/results/"]}}' > "$TMP/.pi/wake-alarm.json"
          echo fake > "$TMP/.pi/id_rsa"
          node -e "const fs=require('fs');const now=Date.now();const overlong='y'.repeat(3000);const c=(i)=>({id:'g-'+i,name:'G #'+i,kind:'container',active:true,createdAt:now,container:'job-'+['a','b'][i-1],events:['exit'],policy:'keep',statusPollMs:60000,nextCheckAt:now,logOffset:0,scanCarry:'',eventFingerprints:{},consecutiveFailures:0,failureNotified:false,groupId:'g',revision:1,lastEvidence:overlong});fs.writeFileSync(process.argv[1],JSON.stringify({version:3,alarms:[{id:'g',name:'G',kind:'group',active:true,createdAt:now,memberIds:['g-1','g-2'],condition:'all_terminal',required:2,statusPollMs:60000,nextCheckAt:now,revision:1},c(1),c(2),{id:'done',name:'Done',kind:'condition',active:true,createdAt:now,path:'/data/results/analysis.json',condition:'exists',statusPollMs:60000,nextCheckAt:now,revision:1,lastEvidence:overlong}],outbox:[]}))" "$TMP/.pi/wake-alarm.state.json"
          WAKE_ALARM_CWD="$TMP" WAKE_ALARM_STATE_PATH="$TMP/.pi/wake-alarm.state.json" WAKE_ALARM_SPAWN_DRY_RUN=1 node node_modules/pi-wake/dist/daemon.js >fixture.log 2>&1 &
          FPID=$!
          sleep 6
          kill "$FPID" 2>/dev/null || true
          wait "$FPID" 2>/dev/null || true
          # The fixture carries overlong 3KB evidence: the installed daemon must
          # MIGRATE it (clamp + rewrite) and still restore all four alarms.
          grep -q "daemon active with 4 alarm(s)" fixture.log || { echo "::error::installed daemon cannot restore group/condition state: $(cat fixture.log)"; exit 1; }
          grep -q "migrated.*overlong evidence" fixture.log || { echo "::error::expected evidence migration log line: $(cat fixture.log)"; exit 1; }
          test -s "$TMP/.pi/wake-alarm.daemon.json" || { echo "::error::daemon heartbeat file missing"; exit 1; }
          echo "group/condition state + overlong evidence migration + daemon heartbeat exercised by the installed daemon"
          echo "::endgroup::"
      - name: extension load smoke (real Pi, RPC mode)
        shell: bash
        run: |
          OUT=$(printf '{"type":"get_state"}\n' | npx --no-install pi --mode rpc --offline --approve --no-session --extension extensions/pi-wake/index.ts 2>&1)
          echo "$OUT" | grep -q '"success":true' || { echo "::error::pi rpc smoke failed: $OUT"; exit 1; }
