name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19.0", "24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: package smoke (real tarball install + bin)
        shell: bash
        run: |
          set -euo pipefail
          TGZ=$(npm pack --silent | tail -1)   # prepack builds dist/
          TMP=$(mktemp -d)
          cd "$TMP"
          npm init -y >/dev/null
          # Install the actual publish tarball, not the source checkout: this catches
          # missing files in the `files` whitelist, broken relative imports, and the
          # pi-wake-daemon bin wiring.
          npm install "$OLDPWD/$TGZ" --no-audit --no-fund --legacy-peer-deps >/dev/null
          test -f node_modules/pi-wake/dist/daemon.js
          test -f node_modules/pi-wake/dist/runtime.js
          test -f node_modules/pi-wake/extensions/pi-wake/index.ts
          node -e "const p=require('pi-wake/package.json'); if(!p.bin||p.bin['pi-wake-daemon']!=='dist/daemon.js') process.exit(1)"
          # Daemon bin smoke from the installed layout: it must start, read the (empty)
          # project state, and stay alive until killed. dist/daemon.js is plain ESM,
          # so it runs on stock Node even under node_modules.
          WAKE_ALARM_CWD="$TMP" WAKE_ALARM_SPAWN_DRY_RUN=1 node node_modules/pi-wake/dist/daemon.js >daemon.log 2>&1 &
          DPID=$!
          sleep 4
          kill "$DPID" 2>/dev/null || true
          wait "$DPID" 2>/dev/null || true
          grep -q "watching project" daemon.log
      - name: extension load smoke (real Pi, RPC mode)
        shell: bash
        run: |
          printf '{"type":"get_state"}\n' | npx --no-install pi --mode rpc --offline --approve --no-session --extension extensions/pi-wake/index.ts | grep -q '"success":true'
