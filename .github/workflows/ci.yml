name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19.0", "24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: package smoke (tarball contents)
        run: npm pack --dry-run
      - name: extension load smoke (real Pi, RPC mode)
        shell: bash
        run: |
          printf '{"type":"get_state"}\n' | npx --no-install pi --mode rpc --offline --approve --no-session --extension extensions/pi-wake/index.ts | grep -q '"success":true'
